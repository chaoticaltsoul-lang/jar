.sm{color:#cdb6ff;font-size:.8rem;margin:0 0 8px;position:relative}.cd{color:#ffe9a8;font-size:.85rem;margin-top:10px;position:relative}

.ss{position:fixed;left:-40px;width:80px;height:2px;background:linear-gradient(90deg,transparent,#fff);opacity:0;pointer-events:none;z-index:1;animation:ssh 9s linear infinite}

"این شیشه رو فقط برای تو ساختم، چون تو لایق هر روز یه ذوق تازه‌ای. امروز اولین روزشه و خیلی خوشحالم که داری بازش می‌کنی 🌸",
